[package]
name = "pico-light-show"
version = "1.1.1"
edition = "2024"
description = "WS2812 LED controller firmware for Raspberry Pi Pico W (web UI, MQTT, DDP, OTA)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "pico-light-show"
test = false
bench = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-time = { version = "0.5.1" }
embassy-sync = { version = "0.8.0" }
embassy-futures = { version = "0.1.2" }
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "dhcpv4-hostname", "dns", "proto-ipv4", "medium-ethernet", "multicast"] }
embassy-embedded-hal = { version = "0.6.0" }
embassy-boot-rp = { version = "0.10.0" }
embassy-usb-logger = { version = "0.6.0", optional = true }
cyw43 = { version = "0.7.0" }
cyw43-pio = { version = "0.10.0" }

picoserve = { version = "0.21.0", features = ["embassy", "ws", "json"] }
sequential-storage = { version = "8.0.2" }
edge-dhcp = { version = "0.8.0" }
edge-captive = { version = "0.8.0", default-features = false }

cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"
portable-atomic = { version = "1.11", features = ["critical-section"] }
static_cell = "2.1"
heapless = { version = "0.9", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.7.0", default-features = false }
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"
smart-leds = "0.4.0"
fixed = "1.23"
pio = "0.3"
libm = "0.2"
log = "0.4"
embedded-tls = { version = "0.19.0", default-features = false }
sha2 = { version = "0.10", default-features = false }

[features]
default = []
# Log output on the USB serial port. Leave off for production builds:
# without it the USB peripheral is not used at all.
console = ["dep:embassy-usb-logger"]
# Diagnostic build without the bootloader (flash layout starts at 0x10000100, no OTA).
standalone = []

[build-dependencies]
flate2 = "1.0"

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1
incremental = false

[profile.dev]
opt-level = "s"
debug = 2
lto = "fat"
codegen-units = 1
