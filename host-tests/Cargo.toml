[package]
name = "host-tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs the firmware's pure logic (effects, transitions, colors) on the PC"

[dependencies]
heapless = { version = "0.9", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.7.0", default-features = false }
